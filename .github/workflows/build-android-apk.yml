name: Build Android APK

# Mirrors the Desktop workflow: pushes to main build for sanity, v* tags
# trigger the actual R2 publish, workflow_dispatch surfaces a manual button.
# Android builds happily on Linux runners so this is much faster (and free
# of the Windows-runner quotas) than the MSI workflow.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Cache Gradle
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle/caches
            ~/.gradle/wrapper
          key: gradle-${{ runner.os }}-${{ hashFiles('**/*.gradle.kts', 'gradle/wrapper/gradle-wrapper.properties') }}

      - name: Grant gradlew execute permission
        run: chmod +x ./gradlew

      # Debug build is intentional for the beta channel — no release keystore
      # is set up yet. When the Play Store keystore is provisioned, swap this
      # for `assembleRelease` and add signing secrets (KEYSTORE_BASE64,
      # KEYSTORE_PASSWORD, KEY_ALIAS, KEY_PASSWORD).
      - name: Build APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate APK
        id: locate
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" | head -1)
          echo "Found: $APK_PATH"
          echo "apk_path=$APK_PATH" >> "$GITHUB_OUTPUT"

      # R2 is the REAL distribution (the /downloads APK). It runs FIRST and
      # independent of the throwaway GitHub artifact below, so an Actions
      # artifact-storage quota hit can never block or skip the actual release.
      - name: Publish to Cloudflare R2
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          AWS_DEFAULT_REGION: auto
          R2_ENDPOINT: ${{ secrets.R2_ENDPOINT }}
          R2_BUCKET: hangarflow-installers
        run: |
          # HARD FAIL, not a warning. This used to `exit 0`, which meant a
          # tagged release with missing secrets produced a green run that
          # shipped nothing — the run says success, customers keep downloading
          # the previous build, and nobody finds out until someone checks the
          # object date on R2. A release that cannot publish is a failed
          # release and has to look like one.
          if [ -z "$AWS_ACCESS_KEY_ID" ] || [ -z "$R2_SECRET_ACCESS_KEY" ] || [ -z "$R2_ENDPOINT" ]; then
            echo "::error::R2 secrets missing (need R2_ACCESS_KEY_ID, R2_SECRET_ACCESS_KEY, R2_ENDPOINT). Nothing was published."
            exit 1
          fi
          aws s3 cp "${{ steps.locate.outputs.apk_path }}" \
            "s3://$R2_BUCKET/Hangar-Flow-Android-Beta.apk" \
            --endpoint-url "$R2_ENDPOINT" \
            --content-type "application/vnd.android.package-archive"
          echo "Published to: https://pub-255b2db29597443abd3ccb6104ab034b.r2.dev/Hangar-Flow-Android-Beta.apk"
          # Confirm the bytes are really there and are the ones we just built.
          # `aws s3 cp` exiting 0 is not proof: this is the distribution path
          # customers actually download from, so the run only goes green once
          # the object on R2 matches the artifact byte for byte.
          LOCAL=$(wc -c < "${{ steps.locate.outputs.apk_path}}" | tr -d ' ')
          REMOTE=$(aws s3api head-object \
            --bucket "$R2_BUCKET" --key "Hangar-Flow-Android-Beta.apk" \
            --endpoint-url "$R2_ENDPOINT" \
            --query ContentLength --output text)
          echo "local=$LOCAL remote=$REMOTE"
          if [ "$LOCAL" != "$REMOTE" ]; then
            echo "::error::R2 object is $REMOTE bytes but the build is $LOCAL — publish did not land."
            exit 1
          fi

      # Convenience copy for manual download from the Actions tab, only on
      # v* tags / manual runs. continue-on-error so a full Actions artifact
      # quota can't fail the release run — the real APK already went to R2.
      - name: Upload APK artifact
        if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: hangar-flow-android-beta-apk
          path: ${{ steps.locate.outputs.apk_path }}
          retention-days: 7
